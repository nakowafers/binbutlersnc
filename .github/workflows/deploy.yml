name: Deploy

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build for Cloudflare
        run: npm run build:cf
        env:
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}

      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: d1 migrations apply binbutlersnc-db --remote

      - name: Upload Worker version
        if: github.ref == 'refs/heads/main'
        id: upload
        run: |
          VERSION_ID=$(npx wrangler versions upload 2>&1 | grep -oE 'Version ID: [a-f0-9-]+' | grep -oE '[a-f0-9-]+$')
          echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Auth.js secrets on version
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.AUTH_SECRET }}" | npx wrangler versions secret put "${{ steps.upload.outputs.version-id }}" AUTH_SECRET
          echo "${{ secrets.AUTH_GOOGLE_ID }}" | npx wrangler versions secret put "${{ steps.upload.outputs.version-id }}" AUTH_GOOGLE_ID
          echo "${{ secrets.AUTH_GOOGLE_SECRET }}" | npx wrangler versions secret put "${{ steps.upload.outputs.version-id }}" AUTH_GOOGLE_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker version
        if: github.ref == 'refs/heads/main'
        run: npx wrangler versions deploy "${{ steps.upload.outputs.version-id }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Workers preview version
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: versions upload --preview-alias ${{ github.ref_name }}

      - name: Deploy daily-dispatch-cron worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: deploy
          workingDirectory: workers/daily-dispatch-cron

      - name: Deploy retry-cron worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: deploy
          workingDirectory: workers/retry-cron
