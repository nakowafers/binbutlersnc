name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build for Cloudflare
        run: npm run build:cf

      - name: Apply D1 migrations (production only)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: d1 migrations apply binbutlersnc-db --remote

      - name: Deploy main site
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: deploy

      - name: Deploy daily-dispatch-cron worker (production only)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: deploy
          workingDirectory: workers/daily-dispatch-cron

      - name: Deploy retry-cron worker (production only)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: deploy
          workingDirectory: workers/retry-cron
