name: Deploy

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build for Cloudflare
        run: npm run build:cf
        env:
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}

      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: d1 migrations apply binbutlersnc-db --remote

      - name: Upload Worker version with application secrets
        if: github.ref == 'refs/heads/main'
        id: upload
        run: |
          umask 077
          SECRETS_FILE=$(mktemp)
          trap 'rm -f "$SECRETS_FILE"' EXIT
          : "${STRIPE_MONTHLY_PRICE_ID:?STRIPE_MONTHLY_PRICE_ID is required}"
          : "${STRIPE_BIMONTHLY_PRICE_ID:?STRIPE_BIMONTHLY_PRICE_ID is required}"
          : "${STRIPE_EXTRA_BIN_MONTHLY_PRICE_ID:?STRIPE_EXTRA_BIN_MONTHLY_PRICE_ID is required}"
          : "${STRIPE_EXTRA_BIN_BIMONTHLY_PRICE_ID:?STRIPE_EXTRA_BIN_BIMONTHLY_PRICE_ID is required}"
          jq -n \
            --arg authSecret "$AUTH_SECRET" \
            --arg authGoogleId "$AUTH_GOOGLE_ID" \
            --arg authGoogleSecret "$AUTH_GOOGLE_SECRET" \
            --arg monthlyPriceId "$STRIPE_MONTHLY_PRICE_ID" \
            --arg bimonthlyPriceId "$STRIPE_BIMONTHLY_PRICE_ID" \
            --arg quarterlyPriceId "$STRIPE_QUARTERLY_PRICE_ID" \
            --arg extraBinMonthlyPriceId "$STRIPE_EXTRA_BIN_MONTHLY_PRICE_ID" \
            --arg extraBinBimonthlyPriceId "$STRIPE_EXTRA_BIN_BIMONTHLY_PRICE_ID" \
            '{
              AUTH_SECRET: $authSecret,
              AUTH_GOOGLE_ID: $authGoogleId,
              AUTH_GOOGLE_SECRET: $authGoogleSecret,
              STRIPE_MONTHLY_PRICE_ID: $monthlyPriceId,
              STRIPE_BIMONTHLY_PRICE_ID: $bimonthlyPriceId,
              STRIPE_QUARTERLY_PRICE_ID: $quarterlyPriceId,
              STRIPE_EXTRA_BIN_MONTHLY_PRICE_ID: $extraBinMonthlyPriceId,
              STRIPE_EXTRA_BIN_BIMONTHLY_PRICE_ID: $extraBinBimonthlyPriceId
            }' > "$SECRETS_FILE"
          VERSION_ID=$(npx wrangler versions upload --secrets-file "$SECRETS_FILE" 2>&1 | grep -oE '[a-f0-9-]{36}' | tail -1)
          echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_BIMONTHLY_PRICE_ID: ${{ secrets.STRIPE_BIMONTHLY_PRICE_ID }}
          STRIPE_QUARTERLY_PRICE_ID: ${{ secrets.STRIPE_QUARTERLY_PRICE_ID }}
          STRIPE_EXTRA_BIN_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_EXTRA_BIN_MONTHLY_PRICE_ID }}
          STRIPE_EXTRA_BIN_BIMONTHLY_PRICE_ID: ${{ secrets.STRIPE_EXTRA_BIN_BIMONTHLY_PRICE_ID }}

      - name: Deploy Worker version
        if: github.ref == 'refs/heads/main'
        run: npx wrangler versions deploy --version-id "${{ steps.upload.outputs.version-id }}" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Workers preview version
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: versions upload --preview-alias ${{ github.ref_name }}

      - name: Deploy daily-dispatch-cron worker
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "4cd5940e1e98aa5f07d422904bc3cfa4"
          command: deploy
          workingDirectory: workers/daily-dispatch-cron
